<text x="48" y="64" class="h">How it decides</text>
<text x="48" y="96" class="s">A frozen LLM reads your message once. Every answer is a valley. The particle rolls and settles: where it settles is the answer.</text>

<!-- the message and the reader -->
<g transform="translate(48,170)">
  <rect width="250" height="66" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="18" y="29" class="chip">"I was charged twice,</text>
  <text x="18" y="51" class="chip">  refund me today."</text>
  <rect y="104" width="250" height="122" rx="18" fill="#0f172a" stroke="url(#ln)" stroke-width="2.5" filter="url(#glow)"/>
  <text x="125" y="156" text-anchor="middle" class="h" style="font-size:24px">frozen LLM</text>
  <text x="125" y="186" text-anchor="middle" class="s">any reader, 0.8B to 27B</text>
  <text x="125" y="208" text-anchor="middle" class="s">reads once, 73k tokens</text>
  <path d="M125,70 L125,98" stroke="#64748b" stroke-width="2.5" stroke-dasharray="5 5"/>
</g>
<path d="M300,335 C330,335 340,161 370,161" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 6">
  <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
</path>

