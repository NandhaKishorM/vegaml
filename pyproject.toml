[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vegaml"
version = "0.9.0"
description = "Typed decisions from a frozen language model and a small physics engine: calibrated probabilities, conformal sets, 73k context, images."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nandakishor M" }]
keywords = ["typed-decisions", "calibration", "conformal-prediction", "decision-model", "long-context"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "torch>=2.4",
  "transformers>=5.17",
  "safetensors>=0.4",
  "huggingface_hub>=0.30,<3.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
# The image path: the backbone's processor is loaded through transformers, and Pillow decodes the file.
# transformers' Qwen3VL processor loads torchvision on the way in and refuses to run without it, so the
# extra has to carry it; leave the version open and let the resolver match the installed torch.
vision = ["pillow>=10.0", "torchvision"]
dev = ["pytest>=8.0", "ruff>=0.6", 'tomli>=2.0; python_version < "3.11"']
# `pip install vegaml[serve]` adds the HTTP server (vegaml.serve / the vegaml-serve command).
serve = ["fastapi>=0.110", "uvicorn>=0.27"]
# `pip install vegaml[mlx]` runs the decision engine on Apple silicon without torch (vegaml.mlx_engine).
mlx = ['mlx>=0.30; platform_machine == "arm64" and sys_platform == "darwin"']
# `pip install vegaml[structured]` adds the pydantic question-sheet helpers (vegaml.structured).
structured = ["pydantic>=2.0"]

[project.scripts]
vegaml = "vegaml.cli:main"
vegaml-serve = "vegaml.serve:main"

[project.urls]
Homepage = "https://github.com/NandhaKishorM/vegaml"
Issues = "https://github.com/NandhaKishorM/vegaml/issues"

[tool.setuptools]
packages = ["vegaml"]

[tool.setuptools.package-data]
vegaml = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py310"
# The Kaggle notebook is GENERATED from notebooks/vega_finetune.py by notebooks/build_finetune_nb.py.
# Linting it separately rewrites the embedded copy of that script, which then no longer matches the
# file the tests ran -- tests/test_notebook.py catches exactly that. The script itself is linted.
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
# No pyupgrade (UP): the engine modules are kept runnable on the Python the training code uses, and
# %-formatting is the house style throughout. Correctness and import hygiene are what matter here.
select = ["E", "F", "W", "I", "B"]
# The vendored inference modules are kept close to the training-time source so the two can be diffed.
exclude = ["vegaml/_common.py", "vegaml/_api.py", "vegaml/_vision.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
