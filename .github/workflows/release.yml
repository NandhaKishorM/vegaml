name: Release

# Tag a commit v0.1.0 and push it: this builds the distributions, checks the version matches the tag,
# and attaches them to a GitHub Release.
#
# Tag a commit v0.1.0 and push it; this builds, verifies the version matches the tag, publishes to
# PyPI and opens a GitHub Release.
#
# Publishing goes through PyPI Trusted Publishing, so no API token exists anywhere in this
# repository. It requires a Trusted Publisher registered on PyPI for:
#   owner NandhaKishorM, repo vegaml, workflow release.yml, environment pypi
# Until that exists the publish step fails with an OIDC error and nothing is uploaded; the build and
# the GitHub Release still run.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  USE_TF: "0"
  USE_TORCH: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip build twine
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,vision]"

      - name: Tests must pass before anything is built
        run: python -m pytest -q

      - name: Build
        run: python -m build

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')   # workflow_dispatch has no tag to match
        run: |
          pkg=$(python -c "import re;print(re.search(r'version = \"(.*)\"', open('pyproject.toml').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "pyproject=$pkg tag=$tag"
          test "$pkg" = "$tag" || { echo "::error::pyproject version $pkg does not match tag $tag"; exit 1; }

      - run: python -m twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write          # the OIDC token Trusted Publishing exchanges; no secret involved
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # The artefacts published are byte-for-byte the ones the build job tested; this job never
      # rebuilds, so nothing can differ between what passed and what ships.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github_release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
