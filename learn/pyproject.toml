[build-system]
# setuptools 77 is the first to read a PEP 639 licence expression.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vegaml-learn"
version = "0.20.0"
description = "Continuous learning for vega: a Learner that learns from confirmed answers, a teacher loop, and the vega Proxy. Free for noncommercial use."
readme = "README.md"
requires-python = ">=3.10"
# Noncommercial only. vegaml itself is Apache 2.0; this package is not.
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Nandakishor M" }]
keywords = ["continuous-learning", "typed-decisions", "vega", "llm-proxy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["vegaml>=0.20.0", "numpy>=1.24"]

[project.optional-dependencies]
# The REST server with JWT: python -m vegaml_learn serve
serve = ["fastapi>=0.110", "uvicorn>=0.27", "pyjwt[crypto]>=2.8"]
# The vega Proxy in front of an LLM API: python -m vegaml_learn proxy
proxy = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
# Claude as the teacher: vegaml_learn.claude_teacher
claude = ["anthropic>=2.0"]

[project.scripts]
vegaml-learn = "vegaml_learn.serve:main"

[project.urls]
Homepage = "https://embedding.in"
Repository = "https://github.com/NandhaKishorM/vegaml/tree/main/learn"
Issues = "https://github.com/NandhaKishorM/vegaml/issues"

[tool.setuptools]
packages = ["vegaml_learn"]
